[project]
# Not an installable package — this table exists to pin the interpreter
# floor for the locked-down sandbox (hard rule 4). Lint targets py312
# (ruff.toml); anything 3.12+ runs the suite.
name = "ams-s7-demo"
version = "0.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Only the real suite. Without this, a bare `pytest` from the repo root sweeps
# up generated artifacts (s7_delivery/out/ staged copies) and dies with
# collection errors before running a single real test.
testpaths = ["tests"]
