<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S7 Delivery — The Developer Loop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 1920px;
        height: 1080px;
        background-color: #ffffff;
        overflow: hidden;
        font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      #master-root {
        width: 1920px;
        height: 1080px;
        position: relative;
        background: radial-gradient(1400px 900px at 50% 36%, #ffffff 0%, #f7f1ea 70%, #f3ece3 100%);
      }
      #master-root .scene {
        position: absolute;
        inset: 0;
      }
      #vignette {
        position: absolute;
        inset: 0;
        z-index: 90;
        pointer-events: none;
        background: radial-gradient(1700px 1100px at 50% 50%, rgba(0, 0, 0, 0) 62%, rgba(120, 60, 40, 0.10) 100%);
        opacity: 0;
      }
      #topbar {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 8px;
        background: #d8232a;
        z-index: 95;
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="master-root"
      data-composition-id="master"
      data-start="0"
      data-duration="85"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="sc-intro"
        class="scene"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div
        id="sc-publish"
        class="scene"
        data-composition-id="publish"
        data-composition-src="compositions/publish.html"
        data-start="sc-intro"
        data-duration="9"
        data-track-index="0"
      ></div>

      <div
        id="sc-clone"
        class="scene"
        data-composition-id="clone"
        data-composition-src="compositions/clone.html"
        data-start="sc-publish"
        data-duration="13"
        data-track-index="0"
      ></div>

      <div
        id="sc-vscode"
        class="scene"
        data-composition-id="vscode"
        data-composition-src="compositions/vscode.html"
        data-start="sc-clone"
        data-duration="27"
        data-track-index="0"
      ></div>

      <div
        id="sc-pushpr"
        class="scene"
        data-composition-id="pushpr"
        data-composition-src="compositions/pushpr.html"
        data-start="sc-vscode"
        data-duration="11"
        data-track-index="0"
      ></div>

      <div
        id="sc-console"
        class="scene"
        data-composition-id="console"
        data-composition-src="compositions/console.html"
        data-start="sc-pushpr"
        data-duration="13"
        data-track-index="0"
      ></div>

      <div
        id="sc-outro"
        class="scene"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="sc-console"
        data-duration="6"
        data-track-index="0"
      ></div>

      <div id="vignette"></div>
      <div id="topbar"></div>

      <script>
        const masterTL = gsap.timeline({ paused: true });
        masterTL.to("#vignette", { opacity: 1, duration: 1.2, ease: "power1.out" }, 0);
        masterTL.from("#topbar", { scaleX: 0, duration: 1.0, ease: "power2.out" }, 0.2);
        window.__timelines["master"] = masterTL;
      </script>
    </div>
  </body>
</html>
