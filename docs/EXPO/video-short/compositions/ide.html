<template id="ide-template">
  <div id="ide-root" data-composition-id="ide" data-width="1920" data-height="1080">
    <div class="pad">
      <span class="kicker d-k">The developer loop · human controlled, AI assisted</span>
      <h2 class="head d-h">One acceptance criterion at a time —<br />and the developer edits the plan.</h2>

      <div class="d-cols">
        <div class="win d-term">
          <div class="bar"><i></i><i></i><i></i><span class="name">zsh — advisor-signin-enhancements</span></div>
          <div class="body">
            <div class="ln g1"><span class="pr">$</span> start working on US-003</div>
            <div class="ln g1 cm">  branch  s7/S7-00002-platform-team</div>
            <div class="ln g1 cm">  4 acceptance criteria, in build order</div>
            <div class="ln g1 cm">  red baseline copied in, unchanged</div>
            <div class="ln g1"><span class="kw">  nothing planned. nothing written.</span></div>
            <div class="ln g2">&nbsp;</div>
            <div class="ln g2"><span class="pr">$</span> plan the next criterion</div>
            <div class="ln g2 cm">  AC-1 plan written to docs/delivery/US-003.md</div>
            <div class="ln g2"><span class="kw">  that section is yours. edit it.</span></div>
            <div class="ln g3">&nbsp;</div>
            <div class="ln g3"><span class="pr">$</span> build the plan</div>
            <div class="ln g3 cm">  re-reading the section as you left it</div>
            <div class="ln g3"><span class="ok">  AC-1 test green · suite green</span></div>
          </div>
        </div>

        <div class="win d-edit">
          <div class="bar"><i></i><i></i><i></i><span class="name">docs/delivery/US-003.md</span></div>
          <div class="body">
            <div class="ln e1 hi">## AC-1 · Remembered device skips the question</div>
            <div class="ln e1">&nbsp;</div>
            <div class="ln e1 cm">Test  test_remembered_device_skips_question</div>
            <div class="ln e1">&nbsp;</div>
            <div class="ln e1 hi">Code plan</div>
            <div class="ln e1">  device_token.py — issue() / verify()</div>
            <div class="ln e1">  signin_view.py — verify before the question</div>
            <div class="ln e2 edit">  REMEMBER_DEVICE_DAYS = 30, not 14</div>
            <div class="ln e1">&nbsp;</div>
            <div class="ln e1 hi">How you will see it</div>
            <div class="ln e1">  Sign in, tick remember, sign out, sign in again.</div>
            <div class="ln e3">&nbsp;</div>
            <div class="ln e3 ok">Observed  confirmed by the developer, in words</div>
          </div>
          <div class="d-flag">developer's own edit — the contract</div>
        </div>
      </div>

      <div class="d-phrases">
        <span class="d-p glass">start working on</span>
        <span class="d-p glass">plan the next criterion</span>
        <span class="d-p glass">build the plan</span>
        <span class="d-p glass">commit the changes</span>
        <span class="d-p glass">please push the code</span>
      </div>
    </div>
    <div class="stagechip"><b>06</b> / 10 · THE DEVELOPER</div>

    <style>
      [data-composition-id="ide"] { position: absolute; inset: 0; }
      #ide-root .d-h { margin-bottom: 40px; }
      #ide-root .d-cols { display: flex; gap: 60px; }
      #ide-root .win { width: 810px; height: 505px; position: relative; }
      #ide-root .win .body { font-size: 19px; line-height: 1.58; padding: 22px 26px; }
      #ide-root .ln { opacity: 0; }
      #ide-root .ln.edit { color: #ffd479; }
      #ide-root .d-flag {
        position: absolute; right: 22px; bottom: 18px; opacity: 0;
        background: var(--red); color: #fff; font-size: 16px; font-weight: 700;
        padding: 8px 18px; border-radius: 999px; letter-spacing: 0.4px;
      }
      #ide-root .d-phrases { display: flex; gap: 14px; margin-top: 36px; }
      #ide-root .d-p {
        border: 1.5px solid var(--line); background: var(--white); color: var(--muted);
        border-radius: 999px; padding: 11px 22px; font-size: 19px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
    </style>

    <script>
      (function () {
        var R = "#ide-root ";
        var tl = gsap.timeline({ paused: true });
        var HID = { opacity: 0, y: 8 };
        function reveal(sel, at, stagger, dur) {
          tl.fromTo(R + sel, HID,
            { opacity: 1, y: 0, duration: dur || 0.28, stagger: stagger, ease: "power1.out" }, at);
        }
        function lit(sel, at) {
          tl.to(R + sel, { borderColor: "#d8232a", color: "#2b2b2b", duration: 0.35 }, at);
        }

        tl.fromTo(R + ".d-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(R + ".d-h", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.45);
        tl.fromTo(R + ".win", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.8, stagger: 0.18, ease: "power3.out" }, 1.1);
        tl.fromTo(R + ".d-p", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.09, ease: "power2.out" }, 1.7);

        /* Three phrases, three beats. The middle one is the point: the plan is
           written, and then it is handed to the developer to change. */
        reveal(".d-term .g1", 2.4, 0.22);
        lit(".d-p:nth-child(1)", 2.4);

        reveal(".d-term .g2", 6.6, 0.24);
        lit(".d-p:nth-child(2)", 6.6);
        reveal(".d-edit .e1", 8.2, 0.14);

        /* the developer rewrites the plan — that edit is the real gate */
        reveal(".d-edit .e2", 11.6, 0, 0.45);
        tl.fromTo(R + ".d-flag", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, 11.9);
        tl.to(R + ".d-edit .e2", { scale: 1.03, duration: 0.4, yoyo: true, repeat: 1, ease: "power2.inOut" }, 12.6);

        reveal(".d-term .g3", 14.4, 0.26);
        lit(".d-p:nth-child(3)", 14.4);
        reveal(".d-edit .e3", 17.8, 0.22);
        lit(".d-p:nth-child(4)", 19.0);
        lit(".d-p:nth-child(5)", 19.9);

        tl.to(R + ".pad", { opacity: 0, y: -22, duration: 0.6, ease: "power2.in" }, 21.3);
        window.__timelines["ide"] = tl;
      })();
    </script>
  </div>
</template>
