<template id="screens-template">
  <div data-composition-id="screens" data-width="1920" data-height="1080">

    <div class="s-block" id="b1">
      <div class="s-head">
        <span class="kicker">Stage 01 · Intake</span>
        <h3 class="sub">The requirement, parsed — not retyped.</h3>
        <p class="s-d">Upload or paste the requirement. Title, objective and numbered requirements are extracted, each traceable to source.</p>
      </div>
      <div class="screen">
        <div class="chrome"><i></i><i></i><i></i><span class="url">s7-delivery-control-centre · run S7&#8209;00002 · Intake</span></div>
        <img src="assets/intake-extraction.jpg" alt="Intake requirement extraction" />
        <div class="hilite" style="left:770px;top:265px;width:638px;height:423px;"></div>
      </div>
    </div>


    <div class="s-block" id="b3">
      <div class="s-head">
        <span class="kicker">Gate 1 · Plan sign-off</span>
        <h3 class="sub">A click is a decision. Typing <span class="accent">y</span> is a prompt.</h3>
        <p class="s-d">The plan locks. Nothing downstream generates, publishes or runs until a named human signs it.</p>
      </div>
      <div class="screen">
        <div class="chrome"><i></i><i></i><i></i><span class="url">s7-delivery-control-centre · run S7&#8209;00002 · Plan Sign-off</span></div>
        <img src="assets/plan-signoff.jpg" alt="Plan sign-off gate" />
        <div class="hilite" style="left:651px;top:307px;width:405px;height:381px;"></div>
      </div>
    </div>

    <div class="s-block" id="b4">
      <div class="s-head">
        <span class="kicker">Stage 04 · Build &amp; test evidence</span>
        <h3 class="sub">Real CI, joined to acceptance criteria.</h3>
        <p class="s-d">Six of six tests passed on a real GitHub Actions run. The baseline beside it stays badged <b>SIMULATED</b>.</p>
      </div>
      <div class="screen">
        <div class="chrome"><i></i><i></i><i></i><span class="url">s7-delivery-control-centre · run S7&#8209;00002 · Build &amp; Test Evidence</span></div>
        <img src="assets/build-test-evidence.jpg" alt="Build and test evidence" />
        <div class="hilite" style="left:1103px;top:454px;width:308px;height:182px;"></div>
      </div>
    </div>

    <div class="stagechip"><b>07</b> / 10 · THE REAL SCREENS</div>

    <style>
      [data-composition-id="screens"] { position: absolute; inset: 0; }
      [data-composition-id="screens"] .s-block { position: absolute; inset: 0; opacity: 0; }
      [data-composition-id="screens"] .s-head { position: absolute; left: 240px; top: 50px; width: 1440px; }
      [data-composition-id="screens"] .s-head .kicker { margin-bottom: 8px; }
      [data-composition-id="screens"] .s-head .sub { margin-bottom: 9px; }
      [data-composition-id="screens"] .s-d { font-size: 23px; line-height: 1.34; white-space: nowrap; color: var(--muted); margin: 0; max-width: 1380px; }
      [data-composition-id="screens"] .s-d b { color: var(--warn); font-weight: 700; }
      [data-composition-id="screens"] .screen { position: absolute; left: 240px; top: 198px; width: 1440px; }
    </style>

    <script>
      (function () {
        var R = '[data-composition-id="screens"] ';
        var tl = gsap.timeline({ paused: true });
        var blocks = ["b1", "b3", "b4"];

        blocks.forEach(function (id, i) {
          var at = i * 7;
          var B = R + "#" + id + " ";
          tl.fromTo(R + "#" + id, { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.out" }, at);
          tl.fromTo(B + ".kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, at + 0.2);
          tl.fromTo(B + ".sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, at + 0.38);
          tl.fromTo(B + ".s-d", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, at + 0.58);
          tl.fromTo(B + ".screen", { opacity: 0, y: 40, scale: 0.975 }, { opacity: 1, y: 0, scale: 1, duration: 0.85, ease: "power3.out" }, at + 0.5);
          /* slow push-in keeps the frame alive without moving text */
          tl.fromTo(B + ".screen", { scale: 1 }, { scale: 1.025, duration: 5.6, ease: "none" }, at + 1.4);
          tl.fromTo(B + ".hilite", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, at + 3.1);
          tl.to(R + "#" + id, { opacity: 0, duration: 0.45, ease: "power1.in" }, at + 6.55);
        });

        window.__timelines["screens"] = tl;
      })();
    </script>
  </div>
</template>
