<template id="one-pack-template">
  <div id="pack-root" data-composition-id="one-pack" data-width="1920" data-height="1080">
    <div class="pad stack">
      <span class="kicker k-k">What the platform actually does</span>
      <h2 class="head k-h">One requirement in. <span class="mark"><span class="swipe"></span><span class="txt">One governed pack out.</span></span></h2>

      <div class="k-req artifact glass sheen t-red">
        <span class="ico"></span>
        <span class="nm">Business requirement</span>
        <span class="mt">·&nbsp; uploaded once, by the business owner</span>
      </div>

      <div class="k-beam"><div class="beam v hot" id="kb1"></div></div>

      <div class="k-pack box glass deep sheen">
        <div class="k-pack-h">
          <span class="lane t-green"><span class="ico"></span>Generated, versioned, and published as files</span>
        </div>
        <div class="k-grid"></div>
      </div>

      <div class="k-beam"><div class="beam v on" id="kb2"></div></div>

      <div class="k-devs"></div>

      <p class="k-punch">Written for the agent as much as the person — the way code is. <b>AC&#8209;2 says five attempts</b>, and the test that proves it is named in the same pack.</p>
    </div>
    <div class="stagechip"><b>03</b> / 10 · THE ANSWER</div>

    <style>
      [data-composition-id="one-pack"] { position: absolute; inset: 0; }
      #pack-root .k-h { margin-bottom: 30px; }
      #pack-root .k-req { align-self: center; width: auto; padding: 15px 28px; }
      #pack-root .k-req .ico svg { width: 24px; height: 24px; color: var(--a-red); display: block; }
      #pack-root .k-req .nm { font-size: 22px; }
      #pack-root .k-req .mt { font-size: 19px; }
      #pack-root .k-beam { display: flex; justify-content: center; height: 34px; }
      #pack-root .beam.v { width: 3px; height: 34px; }
      #pack-root .k-pack { padding: 20px 26px 24px; }
      #pack-root .k-pack-h { display: flex; justify-content: center; margin-bottom: 20px; }
      #pack-root .k-pack-h .lane { font-size: 19px; padding: 8px 20px; }
      #pack-root .k-pack-h .ico svg { width: 20px; height: 20px; display: block; }
      #pack-root .k-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
      #pack-root .k-grid .artifact { padding: 12px 16px; justify-content: flex-start; }
      #pack-root .k-grid .artifact .nm { font-size: 19px; }
      #pack-root .k-grid .artifact .mt { font-size: 16px; }
      #pack-root .k-grid .artifact .col { display: flex; flex-direction: column; line-height: 1.24; }
      #pack-root .k-devs { display: flex; gap: 26px; justify-content: center; margin-bottom: 26px; }
      #pack-root .k-dev {
        display: flex; align-items: center; gap: 14px; padding: 13px 20px; border-radius: 16px;
      }
      #pack-root .k-dev .av {
        width: 40px; height: 40px; border-radius: 50%; flex: none;
        display: flex; align-items: center; justify-content: center;
        font-size: 16px; font-weight: 700; background: var(--bg); color: var(--fg); border: 2px solid var(--ln);
      }
      #pack-root .k-dev .val {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 18px; color: var(--a-green); font-weight: 600;
      }
      #pack-root .k-dev .who { font-size: 18px; color: var(--muted); }
      #pack-root .k-punch { font-size: 22px; color: var(--muted); margin: 0; line-height: 1.36; text-align: center; }
      #pack-root .k-punch b { color: var(--ink); }
    </style>

    <script>
      (function () {
        var R = "#pack-root ";
        var root = document.querySelector("#pack-root");
        var I = window.ICONS;

        var ART = [
          ["doc", "t-red", "epic.md", "the requirement, structured"],
          ["layers", "t-violet", "4 user stories", "one accountable team each"],
          ["check", "t-green", "12 acceptance criteria", "every one carries an id"],
          ["shield", "t-blue", "architecture/v1", "five files, immutable"],
          ["folder", "t-teal", "delivery pack", "per team, by reference"],
          ["flask", "t-amber", "test skeletons", "one failing test per AC"],
          ["bot", "t-slate", "AGENTS.md", "how to work in this repo"],
          ["branch", "t-red", ".s7/ on a branch", "published, managed paths only"],
        ];
        var grid = root.querySelector(".k-grid");
        ART.forEach(function (a, n) {
          var el = document.createElement("div");
          el.className = "artifact glass " + a[1];
          el.id = "ka" + n;
          el.innerHTML = I(a[0]) + '<span class="col"><span class="nm">' + a[2] +
                         '</span><span class="mt">' + a[3] + "</span></span>";
          grid.appendChild(el);
        });

        var DEVS = [
          ["PN", "t-violet", "Dev A", "remember_device_days = 30"],
          ["MR", "t-blue", "Dev B", "lockout_after = 5 attempts"],
          ["SK", "t-amber", "Dev C", "test_lockout_after_5 ✓"],
        ];
        var devs = root.querySelector(".k-devs");
        DEVS.forEach(function (d, n) {
          var el = document.createElement("div");
          el.className = "k-dev box glass " + d[1];
          el.id = "kd" + n;
          el.innerHTML = '<div class="av">' + d[0] + "</div><div><div class=\"who\">" + d[2] +
                         '</div><div class="val">' + d[3] + "</div></div>";
          devs.appendChild(el);
        });
        root.querySelector(".k-req .ico").innerHTML = I("doc");
        root.querySelector(".k-pack-h .ico").innerHTML = I("layers");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(R + ".k-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(R + ".k-h", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.45);
        tl.fromTo(R + ".k-h .swipe", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 1.25);

        /* the requirement drops in from above, then the pack builds under it */
        tl.fromTo(R + ".k-req", { opacity: 0, y: -46, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "back.out(1.6)" }, 2.0);
        tl.fromTo(R + "#kb1", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 2.9);
        tl.fromTo(R + ".k-pack", { opacity: 0, y: 30, scale: 0.97 },
          { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 3.25);
        tl.fromTo(R + ".k-pack-h .lane", { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 3.7);
        ART.forEach(function (a, n) {
          tl.fromTo(R + "#ka" + n, { opacity: 0, y: 22, scale: 0.9 },
            { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 4.15 + n * 0.62);
        });

        tl.fromTo(R + "#kb2", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out" }, 9.7);
        DEVS.forEach(function (d, n) {
          tl.fromTo(R + "#kd" + n, { opacity: 0, y: 26, scale: 0.92 },
            { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.8)" }, 10.1 + n * 1.5);
        });
        tl.fromTo(R + ".k-punch", { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 15.2);

        /* Emphasis beat: the criteria chip and the value it produced light up
           together, so the eye makes the link the sentence is claiming. */
        tl.to(R + "#ka2", { scale: 1.06, duration: 0.45, yoyo: true, repeat: 1,
                            ease: "power2.inOut" }, 17.0);
        tl.to(R + "#kd1", { scale: 1.05, duration: 0.45, yoyo: true, repeat: 1,
                            ease: "power2.inOut" }, 17.9);
        tl.to(R + "#ka5", { scale: 1.06, duration: 0.45, yoyo: true, repeat: 1,
                            ease: "power2.inOut" }, 19.2);
        tl.to(R + "#kd2", { scale: 1.05, duration: 0.45, yoyo: true, repeat: 1,
                            ease: "power2.inOut" }, 20.1);
        tl.to(R + ".pad", { opacity: 0, y: -22, duration: 0.6, ease: "power2.in" }, 23.3);
        window.__timelines["one-pack"] = tl;
      })();
    </script>
  </div>
</template>
