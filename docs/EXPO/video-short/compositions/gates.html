      #gates-root .grail-line path { stroke-dashoffset: 1; }

    <script>
      (function () {
        var R = "#gates-root ";
        var tl = gsap.timeline({ paused: true });
        /* "Five gates" · "named person" · "Twelve quality checks" · "Nine conditions" · "Nothing approves" */
        var T = { rail: 2.2, gates: 2.7, dec: 4.9, qc: 5.8, tiles: 6.1, block: 11.0, note: 11.7, self: 14.2 };
        tl.fromTo(R + ".dp-head", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.1);
        tl.fromTo(R + ".grail", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, T.rail);
        tl.fromTo(R + ".grail-line path", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.8, ease: "power1.inOut" }, T.gates);
        tl.fromTo(R + ".gnode", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.4, ease: "power3.out" }, T.gates);
        tl.fromTo(R + ".dec", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, T.dec);
        tl.fromTo(R + ".dec-row", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.16, ease: "power2.out" }, T.dec + 0.3);
        tl.fromTo(R + ".qcp", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, T.qc);
        tl.fromTo(R + ".qc", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.1, ease: "power2.out" }, T.tiles);
        tl.fromTo(R + ".qc.blk", { scale: 1 }, { scale: 1.05, duration: 0.25, yoyo: true, repeat: 1, stagger: 0.07, ease: "power2.inOut" }, T.block);
        tl.fromTo(R + ".qcnote", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, T.note);
        tl.fromTo(R + ".gnode .lk", { scale: 1 }, { scale: 1.45, duration: 0.3, yoyo: true, repeat: 1, stagger: 0.1, ease: "power2.inOut" }, T.self);
        window.__timelines["gates"] = tl;
      })();
