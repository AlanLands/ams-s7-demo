<template id="upstream-template">
  <div id="upstream-root" data-composition-id="upstream" data-width="1920" data-height="1080">
    <!-- Deck slide 5: four upstream steps, each with a real Control Center screen (run S7-00002, synthetic data). -->
    <div class="st16">
      <div class="abs glass hdr stagechip">
        <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#faf8f4" stroke-width="2.2" stroke-linecap="round"><path d="M4 16c3-1 5-7 8-7s5 6 8 7"/><circle cx="12" cy="8" r="1.6" fill="#faf8f4" stroke="none"/></svg></span>
        <b>Control Center</b><i></i><span>Upstream</span>
      </div>
      <div class="abs glass pg stagechip">05 / 11</div>

      <div class="abs center-head">
        <p class="kick"><i></i>Upstream<i></i></p>
        <h2 class="t-h1">
          <span class="l1"><em>Agree what done means —</em></span>
          <span class="l2 grad"><em>before any code is written.</em></span>
        </h2>
      </div>

      <div class="abs steps4">
        <article class="glass stepcard k1"><span class="ring2"></span>
          <div class="sc-top"><span class="app blue"><svg><use href="#i-file-text"/></svg></span><span class="no">Step 1</span><span class="gate"><svg><use href="#i-lock"/></svg>Business owner</span></div>
          <h3>Requirement in</h3>
          <p class="dsc">The business uploads the document. AI extracts it — nobody retypes a word.</p>
          <div class="thumb" style="background-image:url('assets/intake-extraction-crop.jpg');background-size:200%;background-position:94% 100%"><span class="real">Real screen</span></div>
        </article>
        <article class="glass stepcard k2"><span class="ring2"></span>
          <div class="sc-top"><span class="app violet"><svg><use href="#i-sparkles"/></svg></span><span class="no">Step 2</span></div>
          <h3>AI plans it</h3>
          <p class="dsc">AI breaks the requirement into stories, each with numbered acceptance criteria.</p>
          <div class="thumb" style="background-image:url('assets/epic-to-stories-crop.jpg');background-size:170%;background-position:5% 100%"><span class="real">Real screen</span></div>
        </article>
        <article class="glass stepcard k3"><span class="ring2"></span>
          <div class="sc-top"><span class="app gold"><svg><use href="#i-clipboard-list"/></svg></span><span class="no">Step 3</span><span class="gate"><svg><use href="#i-lock"/></svg>Business owner</span></div>
          <h3>Human signs</h3>
          <p class="dsc">A named owner checks every item and signs. The plan locks.</p>
          <div class="thumb" style="background-image:url('assets/plan-signoff-crop.jpg');background-size:180%;background-position:82% 50%"><span class="real">Real screen</span></div>
        </article>
        <article class="glass stepcard k4"><span class="ring2"></span>
          <div class="sc-top"><span class="app ink"><svg><use href="#i-git-branch"/></svg></span><span class="no">Step 4</span></div>
          <h3>Kit published</h3>
          <p class="dsc">Architecture and test plan approved, then one kit per team goes to git.</p>
          <div class="thumb" style="background-image:url('assets/delivery-packs-crop.jpg');background-size:170%;background-position:5% 55%"><span class="real">Real screen</span></div>
        </article>
      </div>
    </div>

    <style>
      #upstream-root .center-head { top: 64px; }
      #upstream-root .steps4 { top: 252px; }
      #upstream-root .stepcard { padding-bottom: 20px; }
      #upstream-root .thumb { height: 140px; }
      #upstream-root .ring2 {
        position: absolute; inset: -3px; border-radius: 32px; border: 3px solid rgba(186, 12, 47, 0.55);
        box-shadow: 0 20px 50px -24px rgba(142, 10, 35, 0.5); opacity: 0; pointer-events: none; z-index: 3;
      }
    </style>

    <script>
      (function () {
        var R = "#upstream-root ";
        var tl = gsap.timeline({ paused: true });
        /* "uploads" · "breaks it into stories" · "A named owner" · "Then the kit" */
        var AT = [1.2, 5.8, 10.5, 14.9];
        tl.fromTo(R + ".kick", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
        tl.fromTo(R + ".t-h1 em", { yPercent: 112 }, { yPercent: 0, duration: 0.9, stagger: 0.14, ease: "expo.out" }, 0.25);
        AT.forEach(function (at, i) {
          var k = R + ".k" + (i + 1);
          tl.fromTo(k, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, at);
          tl.fromTo(k + " .ring2", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, at + 0.2);
          if (i < AT.length - 1) {
            tl.to(k + " .ring2", { opacity: 0, duration: 0.35, ease: "power2.in" }, AT[i + 1]);
          }
        });
        window.__timelines["upstream"] = tl;
      })();
    </script>
  </div>
</template>
