<template id="proof-template">
  <div id="proof-root" data-composition-id="proof" data-width="1920" data-height="1080">
    <div class="pad stack">
      <span class="kicker e-k">Evidence, not assertion</span>
      <h2 class="head e-h">One requirement, taken to a<br />released application <span class="mark"><span class="swipe"></span><span class="txt">overnight</span></span>.</h2>

      <div class="e-tiles"></div>

      <div class="e-proof"></div>

      <p class="lede e-f">Reported only where the run's own ledgers evidence it. Estimation accuracy, defect leakage and cost per release read <b class="accent">not measurable</b> — with the reason — until a baseline exists.</p>
    </div>
    <div class="stagechip"><b>12</b> / 13 · PROOF</div>

    <style>
      [data-composition-id="proof"] { position: absolute; inset: 0; }
      #proof-root .e-h { margin-bottom: 44px; }
      #proof-root .e-tiles { display: flex; gap: 24px; margin-bottom: 34px; }
      #proof-root .e-tile { flex: 1; padding: 24px 26px 22px; }
      #proof-root .e-tile .ic { margin-bottom: 16px; }
      #proof-root .e-tile .v { font-size: 60px; font-weight: 700; color: var(--ink); line-height: 1; letter-spacing: -1.4px; }
      #proof-root .e-tile .v.red { color: var(--a-red); }
      #proof-root .e-tile .k { font-size: 19px; color: var(--muted); margin-top: 12px; line-height: 1.3; }
      #proof-root .e-proof { display: flex; gap: 14px; margin-bottom: 34px; }
      #proof-root .e-proof .pill { font-size: 20px; padding: 10px 22px; gap: 10px; }
      #proof-root .e-proof .pill svg { width: 20px; height: 20px; color: var(--a-green); }
      #proof-root .e-f { font-size: 24px; max-width: 1560px; }
    </style>

    <script>
      (function () {
        var R = "#proof-root ";
        var root = document.querySelector("#proof-root");
        var I = window.ICONS;

        var TILES = [
          ["clock", "t-red", "1", 0, "autonomous overnight run — intake to a released, running application", true],
          ["shield", "t-green", "98.5", 1, "test coverage on the delivered application", false, "%"],
          ["check", "t-blue", "100", 0, "of artifacts carry a provenance badge", false, "%"],
          ["chart", "t-violet", "78", 0, "faster evidence-sync turnaround, 65s to 14s — measured", false, "%", "−"],
        ];
        var wrap = root.querySelector(".e-tiles");
        TILES.forEach(function (t, n) {
          var el = document.createElement("div");
          el.className = "e-tile box glass sheen " + t[1];
          el.id = "et" + n;
          el.innerHTML = '<div class="ic ' + t[1] + '">' + I(t[0]) + "</div>" +
            '<div class="v' + (t[5] ? " red" : "") + '">' + (t[7] || "") +
            '<span data-count="' + t[2] + '" data-dp="' + t[3] + '"></span>' + (t[6] || "") + "</div>" +
            '<div class="k">' + t[4] + "</div>";
          wrap.appendChild(el);
        });

        var PROOF = ["Real repository", "Real pull request", "Merged to default branch", "Green CI", "Five named approvals"];
        var pr = root.querySelector(".e-proof");
        PROOF.forEach(function (t) {
          var el = document.createElement("span");
          el.className = "pill glass";
          el.innerHTML = I("check") + "<span>" + t + "</span>";
          pr.appendChild(el);
        });

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(R + ".e-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(R + ".e-h", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.45);
        tl.fromTo(R + ".e-h .swipe", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 1.25);
        tl.fromTo(R + ".e-tile", { opacity: 0, y: 34, scale: 0.93 },
          { opacity: 1, y: 0, scale: 1, duration: 0.62, stagger: 0.26, ease: "back.out(1.7)" }, 1.5);
        tl.fromTo(R + ".e-tile .ic", { scale: 0.5, rotate: -10 },
          { scale: 1, rotate: 0, duration: 0.5, stagger: 0.26, ease: "back.out(3)" }, 1.62);

        /* counters: a proxy per tile, written on update — deterministic under seek */
        var spans = document.querySelectorAll(R + "[data-count]");
        Array.prototype.forEach.call(spans, function (el, i) {
          var target = parseFloat(el.getAttribute("data-count"));
          var dp = parseInt(el.getAttribute("data-dp"), 10);
          var proxy = { v: 0 };
          el.textContent = (0).toFixed(dp);
          tl.to(proxy, {
            v: target, duration: 1.15, ease: "power2.out",
            onUpdate: function () { el.textContent = proxy.v.toFixed(dp); }
          }, 1.75 + i * 0.26);
        });

        tl.fromTo(R + ".e-proof .pill", { opacity: 0, y: 16, scale: 0.9 },
          { opacity: 1, y: 0, scale: 1, duration: 0.45, stagger: 0.16, ease: "back.out(2.2)" }, 4.6);
        tl.fromTo(R + ".e-f", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.75, ease: "power2.out" }, 6.2);
        /* Closing beat: the two figures we actually measured. */
        tl.to(R + "#et1", { scale: 1.045, duration: 0.45, yoyo: true, repeat: 1,
                            ease: "power2.inOut" }, 8.0);
        tl.to(R + "#et3", { scale: 1.045, duration: 0.45, yoyo: true, repeat: 1,
                            ease: "power2.inOut" }, 9.0);
        tl.to(R + ".e-f", { scale: 1.012, duration: 0.5, yoyo: true, repeat: 1,
                            ease: "power2.inOut" }, 10.2);
        tl.to(R + ".pad", { opacity: 0, y: -22, duration: 0.6, ease: "power2.in" }, 13.3);
        window.__timelines["proof"] = tl;
      })();
    </script>
  </div>
</template>
