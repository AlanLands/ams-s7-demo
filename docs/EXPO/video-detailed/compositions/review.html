<template id="review-template">
  <div id="review-root" data-composition-id="review" data-width="1920" data-height="1080">
    <div class="pad stack">
      <span class="kicker r-k">The invariant</span>
      <h2 class="head r-h">No phase self-approves.</h2>

      <div class="r-cols">
        <div class="r-left">
          <div class="r-chain">
            <div class="r-node box glass sheen"><span class="r-n">A</span><b>Generate</b><i>One model produces the artifact</i></div>
            <div class="r-arrow"></div>
            <div class="r-node red box glass sheen"><span class="r-n">B</span><b>Verify</b><i>A different model checks it, adversarially</i></div>
            <div class="r-arrow"></div>
            <div class="r-node green box glass sheen"><span class="r-n">H</span><b>Human</b><i>Only then does a person see it</i></div>
          </div>
          <div class="caption r-c box glass sheen">
            <p class="t">The bounded loop reports what it could not finish.</p>
            <p class="d">Write test, generate code, validate — with a hard iteration cap. When the cap is hit the run reports the remaining failures and the open questions by id. It never presents partial output as success.</p>
          </div>
        </div>

        <div class="r-right">
          <div class="card r-card box glass sheen">
            <p class="card-h">A build that did not compile is not a red baseline.</p>
            <p class="card-b">CI reports the build itself, not just the tests it managed to run.</p>
            <div class="r-codes">
              <span class="badge human">build: succeeded</span>
              <span class="badge rule">build: no_tests</span>
              <span class="badge sim">build: failed</span>
            </div>
            <p class="card-b r-null">When the build failed, <b>tests_total is null — never zero</b>. A run that never compiled once reported “0 failures”, and the screen called it a red baseline. That is the one failure this whole system exists to prevent, so it is now impossible to report.</p>
          </div>
        </div>
      </div>
    </div>
    <div class="stagechip"><b>10</b> / 13 · INDEPENDENT REVIEW</div>

    <style>
      [data-composition-id="review"] { position: absolute; inset: 0; }
      #review-root .r-h { margin-bottom: 54px; }
      #review-root .r-cols { display: flex; gap: 44px; align-items: stretch; }
      #review-root .r-left { width: 940px; display: flex; flex-direction: column; gap: 30px; }
      #review-root .r-right { width: 696px; display: flex; }
      #review-root .r-chain { display: flex; align-items: stretch; gap: 0; }
      #review-root .r-node {
        flex: 1; background: var(--white); border: 1.5px solid var(--line);
        border-top: 5px solid var(--muted);
        border-radius: 12px; padding: 22px 24px; text-align: left;
      }
      #review-root .r-node.red { border-top-color: var(--red); }
      #review-root .r-node.green { border-top-color: var(--ok); }
      #review-root .r-n {
        display: inline-flex; width: 38px; height: 38px; border-radius: 50%;
        background: var(--slate-bg); color: var(--slate); align-items: center; justify-content: center;
        font-weight: 700; font-size: 19px; margin-bottom: 12px;
      }
      #review-root .r-node.red .r-n { background: #fdeced; color: var(--red); }
      #review-root .r-node.green .r-n { background: var(--ok-bg); color: var(--ok); }
      #review-root .r-node b { display: block; font-size: 25px; color: var(--ink); margin-bottom: 5px; }
      #review-root .r-node i { display: block; font-size: 18px; color: var(--muted); font-style: normal; line-height: 1.3; }
      #review-root .r-arrow { width: 44px; align-self: center; height: 3px; background: var(--line); }
      #review-root .r-card { padding: 28px 32px; }
      #review-root .r-card .card-h { font-size: 27px; line-height: 1.16; }
      #review-root .r-card .card-b { font-size: 20px; line-height: 1.38; }
      #review-root .r-codes { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
      #review-root .r-codes .badge {
        font-size: 15px; padding: 8px 14px; letter-spacing: 0.6px;
        flex: none; white-space: nowrap; width: fit-content;
      }
      #review-root .r-null b { color: var(--ink); font-weight: 700; }
    </style>

    <script>
      (function () {
        var R = "#review-root ";
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(R + ".r-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(R + ".r-h", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.45);
        tl.fromTo(R + ".r-node", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.7, ease: "power2.out" }, 1.4);
        tl.fromTo(R + ".r-arrow", { scaleX: 0 }, { scaleX: 1, duration: 0.35, stagger: 0.7, ease: "none" }, 1.9);
        tl.fromTo(R + ".r-card", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 4.4);
        tl.fromTo(R + ".r-codes .badge", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.22, ease: "power2.out" }, 5.6);
        tl.fromTo(R + ".r-null", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 7.2);
        tl.fromTo(R + ".r-c", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 9.4);
        tl.to(R + ".pad", { opacity: 0, y: -22, duration: 0.6, ease: "power2.in" }, 17.3);
        window.__timelines["review"] = tl;
      })();
    </script>
  </div>
</template>
