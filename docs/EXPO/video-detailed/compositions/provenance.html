<template id="provenance-template">
  <div id="prov-root" data-composition-id="provenance" data-width="1920" data-height="1080">
    <div class="pad stack">
      <span class="kicker v-k">Why you can believe what is on the screen</span>
      <h2 class="head v-h">Every artifact says <span class="mark"><span class="swipe"></span><span class="txt">what made it</span></span>.</h2>
      <div class="v-rows"></div>
      <div class="caption v-c box glass sheen">
        <p class="t">A staged artifact presented as a live AI result is the one failure that loses the room.</p>
        <p class="d">So the label ships with the artifact — on the screen, in the exported document, and in the run record. A simulated event is never counted as an AI workflow anywhere the ledger is rendered.</p>
      </div>
    </div>
    <div class="stagechip"><b>11</b> / 13 · HONESTY</div>

    <style>
      [data-composition-id="provenance"] { position: absolute; inset: 0; }
      #prov-root .v-h { margin-bottom: 44px; }
      #prov-root .v-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
      #prov-root .v-row { display: flex; align-items: center; gap: 20px; padding: 20px 24px; }
      #prov-root .v-row .bd {
        font-size: 17px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
        color: var(--fg); background: var(--bg); border: 1.5px solid var(--ln);
        border-radius: 999px; padding: 6px 16px; display: inline-block; margin-bottom: 7px;
      }
      #prov-root .v-row p { margin: 0; font-size: 20px; color: var(--muted); line-height: 1.32; }
      #prov-root .v-c { padding: 22px 28px; }
    </style>

    <script>
      (function () {
        var R = "#prov-root ";
        var root = document.querySelector("#prov-root");
        var I = window.ICONS;
        var ROWS = [
          ["bot", "t-blue", "Live AI", "A real model call, recorded so it replays byte-for-byte offline."],
          ["code", "t-slate", "Rule based", "Deterministic code, no model. A heuristic is never dressed up as AI."],
          ["alert", "t-amber", "Simulated", "Demo-engine output. Never counted as AI work in any ledger."],
          ["dev", "t-green", "Human", "A person's own input or approval, under the role that signed it."],
        ];
        var wrap = root.querySelector(".v-rows");
        ROWS.forEach(function (r, n) {
          var el = document.createElement("div");
          el.className = "v-row box glass sheen " + r[1];
          el.id = "vr" + n;
          el.innerHTML = '<div class="ic ' + r[1] + '">' + I(r[0]) + "</div>" +
                         '<div><span class="bd">' + r[2] + "</span><p>" + r[3] + "</p></div>";
          wrap.appendChild(el);
        });

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(R + ".v-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(R + ".v-h", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.45);
        tl.fromTo(R + ".v-h .swipe", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 1.25);
        ROWS.forEach(function (r, n) {
          tl.fromTo(R + "#vr" + n, { opacity: 0, y: 26, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 1.6 + n * 1.5);
          tl.fromTo(R + "#vr" + n + " .ic", { scale: 0.5, rotate: -10 },
            { scale: 1, rotate: 0, duration: 0.5, ease: "back.out(3)" }, 1.7 + n * 1.5);
        });
        tl.fromTo(R + ".v-c", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 8.4);
        tl.to(R + ".pad", { opacity: 0, y: -22, duration: 0.6, ease: "power2.in" }, 13.3);
        window.__timelines["provenance"] = tl;
      })();
    </script>
  </div>
</template>
