<template id="problem-context-template">
  <div id="pctx-root" data-composition-id="problem-context" data-width="1920" data-height="1080">
    <div class="pad stack">
      <span class="kicker c-k">What actually happens on a real delivery</span>
      <h2 class="head c-h">One story. Three developers.<br /><span class="mark"><span class="swipe"></span><span class="txt">Three different contexts.</span></span></h2>

      <div class="c-row"></div>

      <div class="c-foot">
        <div class="c-req box glass sheen">
          <div class="ic sm t-red"></div>
          <div class="c-req-t">
            <b>The requirement actually said:</b>
            a remembered device skips the question for <i>30 days</i>, and the account locks after <i>5</i> failed attempts for <i>15 minutes</i>.
          </div>
        </div>
        <p class="c-punch">Nobody was careless. They were each working from <span class="accent">whatever context they could find</span>.</p>
      </div>
    </div>
    <div class="stagechip"><b>02</b> / 13 · THE PROBLEM</div>

    <style>
      [data-composition-id="problem-context"] { position: absolute; inset: 0; }
      #pctx-root .c-h { margin-bottom: 44px; }
      #pctx-root .c-row { display: flex; gap: 60px; margin-bottom: 40px; align-items: stretch; }
      #pctx-root .persona { padding: 26px 28px; display: flex; flex-direction: column; }
      #pctx-root .persona .out { margin-top: auto; }
      #pctx-root .c-foot { display: flex; align-items: center; gap: 34px; }
      #pctx-root .c-req { display: flex; align-items: center; gap: 18px; padding: 20px 26px; flex: 1; }
      #pctx-root .c-req-t { font-size: 20px; color: var(--muted); line-height: 1.34; }
      #pctx-root .c-req-t b { color: var(--ink); }
      #pctx-root .c-req-t i { font-style: normal; font-weight: 700; color: var(--a-green); }
      #pctx-root .c-punch { font-size: 22px; color: var(--ink-soft); margin: 0; width: 620px; line-height: 1.34; }
    </style>

    <script>
      (function () {
        var R = "#pctx-root ";
        var root = document.querySelector("#pctx-root");
        var I = window.ICONS;

        var PEOPLE = [
          { i: "PN", nm: "Dev A", rl: "Frontend", tone: "t-violet",
            ctx: [["doc", "Pasted the ticket into their assistant"],
                  ["question", "Wrote their own prompt from scratch"],
                  ["folder", "Copied a component from last sprint"]],
            out: 'remember_device_days = <span class="bad">14</span>' },
          { i: "MR", nm: "Dev B", rl: "API", tone: "t-blue",
            ctx: [["doc", "A README last edited two years ago"],
                  ["code", "The OpenAPI spec, mostly current"],
                  ["people", "A corridor chat with a colleague"]],
            out: 'lockout_after = <span class="bad">3</span> attempts' },
          { i: "SK", nm: "Dev C", rl: "QA", tone: "t-amber",
            ctx: [["doc", "The ticket title, and not much else"],
                  ["alert", "No acceptance criteria to test against"]],
            out: 'lockout test: <span class="bad">not written</span>' },
        ];

        var row = root.querySelector(".c-row");
        PEOPLE.forEach(function (p, n) {
          var el = document.createElement("div");
          el.className = "persona box glass sheen " + p.tone;
          el.id = "pc" + n;
          el.innerHTML =
            '<div class="who"><div class="av">' + p.i + '</div>' +
            '<div><div class="nm">' + p.nm + '</div><div class="rl">' + p.rl + '</div></div></div>' +
            '<div class="ctx">' + p.ctx.map(function (c) {
              return '<div class="row">' + I(c[0]) + "<span>" + c[1] + "</span></div>";
            }).join("") + "</div>" +
            '<div class="out">' + p.out + "</div>";
          row.appendChild(el);
        });
        root.querySelector(".c-req .ic").innerHTML = I("doc");

        var tl = gsap.timeline({ paused: true });
        tl.fromTo(R + ".c-k", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(R + ".c-h", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.45);
        tl.fromTo(R + ".c-h .swipe", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 1.25);

        PEOPLE.forEach(function (p, n) {
          var C = R + "#pc" + n + " ";
          var at = 2.0 + n * 3.9;
          tl.fromTo(R + "#pc" + n, { opacity: 0, y: 46, scale: 0.94 },
            { opacity: 1, y: 0, scale: 1, duration: 0.72, ease: "back.out(1.5)" }, at);
          tl.fromTo(C + ".ctx .row", { opacity: 0, x: -16 },
            { opacity: 1, x: 0, duration: 0.42, stagger: 0.30, ease: "power2.out" }, at + 0.55);
          tl.fromTo(C + ".out", { opacity: 0, y: 14 },
            { opacity: 1, y: 0, duration: 0.5, ease: "back.out(2)" }, at + 0.55 + p.ctx.length * 0.30 + 0.2);
        });

        tl.fromTo(R + ".c-req", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" }, 15.0);
        tl.fromTo(R + ".c-punch", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.65, ease: "power2.out" }, 16.2);

        /* Each wrong answer flares in turn — three answers, none of them right. */
        PEOPLE.forEach(function (p, n) {
          tl.to(R + "#pc" + n + " .out", { scale: 1.045, duration: 0.4, yoyo: true,
            repeat: 1, ease: "power2.inOut" }, 17.6 + n * 0.7);
        });
        tl.to(R + ".pad", { opacity: 0, y: -22, duration: 0.6, ease: "power2.in" }, 20.3);
        window.__timelines["problem-context"] = tl;
      })();
    </script>
  </div>
</template>
