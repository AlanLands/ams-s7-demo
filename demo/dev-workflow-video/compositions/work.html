    <script>
      function workType(tl, sel, at, speed) {
        const el = document.querySelector(sel);
        const text = el.dataset.text;
        el.textContent = "";
        const spans = [];
        for (const ch of text) {
          const s = document.createElement("span");
          s.textContent = ch;
          s.style.opacity = "0";
          el.appendChild(s);
          spans.push(s);
        }
        tl.to(spans, { opacity: 1, duration: 0.01, stagger: speed }, at);
        return at + text.length * speed;
      }
      const tl = gsap.timeline({ paused: true });
      tl.from("[data-composition-id='work'] .step-tag", { opacity: 0, y: -16, duration: 0.5 }, 0.1);
      tl.from("[data-composition-id='work'] .term", { opacity: 0, y: 34, duration: 0.6, ease: "power3.out" }, 0.3);

      // 1. Branch off main
      let t = workType(tl, "[data-composition-id='work'] .c1", 1.0, 0.02);
      tl.from("[data-composition-id='work'] .o1", { opacity: 0, duration: 0.3 }, t + 0.25);

      // 2. Write the test first (editor slides in on the test tab)
      tl.from("[data-composition-id='work'] .editor", { opacity: 0, x: 60, duration: 0.6, ease: "power3.out" }, 2.6);
      tl.from("[data-composition-id='work'] .code-test .cl", { opacity: 0, x: 14, duration: 0.22, stagger: 0.24 }, 3.3);

      // 3. Red baseline
      t = workType(tl, "[data-composition-id='work'] .c2", 5.6, 0.03);
      tl.from("[data-composition-id='work'] .o2", { opacity: 0, duration: 0.3 }, t + 0.35);
      tl.from("[data-composition-id='work'] .o2b", { opacity: 0, duration: 0.3 }, t + 0.7);

      // 4. Implement: tab swap to app/main.py, code types in
      tl.to("[data-composition-id='work'] .ed-file-test", { color: "#8b8794", borderBottomColor: "rgba(0,0,0,0)", duration: 0.25 }, 8.3);
      tl.to("[data-composition-id='work'] .ed-file-app", { color: "#cfccd9", borderBottomColor: "#8f1f2e", duration: 0.25 }, 8.3);
      tl.to("[data-composition-id='work'] .code-test", { opacity: 0, duration: 0.25 }, 8.3);
      tl.to("[data-composition-id='work'] .code-app", { opacity: 1, duration: 0.25 }, 8.55);
      tl.from("[data-composition-id='work'] .code-app .cl", { opacity: 0, x: 14, duration: 0.22, stagger: 0.24 }, 8.9);

      // 5. Green
      t = workType(tl, "[data-composition-id='work'] .c3", 11.4, 0.03);
      tl.from("[data-composition-id='work'] .o3", { opacity: 0, duration: 0.3 }, t + 0.35);

      // 6. Commit with the story id
      t = workType(tl, "[data-composition-id='work'] .c4", t + 1.0, 0.02);
      tl.from("[data-composition-id='work'] .o4", { opacity: 0, duration: 0.3 }, t + 0.3);
      tl.from("[data-composition-id='work'] .callout", { opacity: 0, y: 14, duration: 0.55 }, 16.2);

      // Exit
      tl.to("[data-composition-id='work'] .term", { opacity: 0, x: -50, duration: 0.5, ease: "power2.in" }, 18.3);
      tl.to("[data-composition-id='work'] .editor", { opacity: 0, x: 50, duration: 0.5, ease: "power2.in" }, 18.35);
      tl.to("[data-composition-id='work'] .callout", { opacity: 0, duration: 0.4 }, 18.4);
      tl.to("[data-composition-id='work'] .step-tag", { opacity: 0, duration: 0.4 }, 18.4);
      window.__timelines["work"] = tl;
    </script>
