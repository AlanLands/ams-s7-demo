    <script>
      function workType(tl, sel, at, speed) {
        const el = document.querySelector(sel);
        const text = el.dataset.text;
        el.textContent = "";
        const spans = [];
        for (const ch of text) {
          const s = document.createElement("span");
          s.textContent = ch;
          s.style.opacity = "0";
          el.appendChild(s);
          spans.push(s);
        }
        tl.to(spans, { opacity: 1, duration: 0.01, stagger: speed }, at);
        return at + text.length * speed;
