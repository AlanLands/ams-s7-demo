    <script>
      function taskType(tl, sel, at, speed) {
        const el = document.querySelector(sel);
        const text = el.dataset.text;
        el.textContent = "";
        const spans = [];
        for (const ch of text) {
          const s = document.createElement("span");
          s.textContent = ch;
          s.style.opacity = "0";
          el.appendChild(s);
          spans.push(s);
        }
        tl.to(spans, { opacity: 1, duration: 0.01, stagger: speed }, at);
        return at + text.length * speed;
      }
      const tl = gsap.timeline({ paused: true });
      tl.from("[data-composition-id='task'] .step-tag", { opacity: 0, y: -16, duration: 0.5 }, 0.1);

      tl.from("[data-composition-id='task'] .o1", { opacity: 0, duration: 0.3 }, t + 0.3);
      tl.from("[data-composition-id='task'] .o2", { opacity: 0, duration: 0.3 }, t + 0.6);

      tl.to("[data-composition-id='task'] .step-tag", { opacity: 0, duration: 0.4 }, 10.4);
